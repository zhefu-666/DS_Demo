# 阶段 2/3/4/6：双 Mid-360 驱动内合并。
#  - 合并点云：livox/lidar（后雷达点经 merge_extrinsic_back_to_front 变换到前雷达坐标系）
#  - IMU：仍按雷达分话题 livox/imu_192_168_1_135 / livox/imu_192_168_1_122
#  - 任一雷达断流时合并输出停止（驱动打印 "waiting for front/back lidar data"）
# 外参由 dual_lidar_calibration 标定后替换，格式 [x, y, z, roll, pitch, yaw]（m, rad），
# 含义 p_front = R(rpy, ZYX) * p_back + t。
/**:
  ros__parameters:
    xfer_format: 1
    multi_topic: 1          # 合并只在 multi_topic=1 时生效
    data_src: 0
    publish_freq: 20.0
    output_data_type: 0
    frame_id: livox_frame
    lvx_file_path: /home/livox/livox_test.lvx
    user_config_path: "$(find-pkg-share handheld_bringup)/config/driver/dual_mid360.json"
    cmdline_input_bd_code: livox0000000001
    enable_internal_lidar_merge: true
    enable_merge_debug: false
    merge_front_ip: 192.168.1.135
    merge_back_ip: 192.168.1.122
    merge_output_topic: livox/lidar
    merge_frame_id: livox_frame
    merge_max_interval_ms: 5.0     # 前后帧 base_time 差超过此值时丢弃较旧一帧；PTP 未同步时会持续丢帧
    merge_extrinsic_back_to_front: [0.0, 0.38, -0.05, -0.36713, 0.0, 0.0]
