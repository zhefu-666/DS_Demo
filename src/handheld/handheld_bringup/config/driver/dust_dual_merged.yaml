# 双雷达 LIO：20Hz 驱动内合并，外参由 launch 显式传入，禁止复用旧安装外参。
/**:
  ros__parameters:
    xfer_format: 1
    multi_topic: 1
    data_src: 0
    publish_freq: 20.0
    output_data_type: 0
    frame_id: livox_frame
    lvx_file_path: /home/livox/livox_test.lvx
    user_config_path: $(find-pkg-share handheld_bringup)/config/driver/dust_dual_mid360.json
    cmdline_input_bd_code: livox0000000001
    enable_internal_lidar_merge: true
    enable_merge_debug: false
    merge_front_ip: 192.168.25.136
    merge_back_ip: 192.168.25.100
    merge_output_topic: livox/lidar
    merge_frame_id: livox_frame
    merge_max_interval_ms: 5.0
